<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GameCompass - Catálogo de Jogos</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #2c3e50; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .card h3 { margin-top: 0; color: #2980b9; }
        .dev { font-size: 0.9em; color: #7f8c8d; margin-bottom: 10px; }
        .desc { font-size: 0.95em; color: #555; margin-bottom: 15px; flex-grow: 1; }
        .genres { margin-bottom: 15px; }
        .badge { display: inline-block; background: #e0f2fe; color: #0369a1; padding: 3px 8px; border-radius: 4px; font-size: 0.8em; margin-right: 5px; margin-bottom: 5px; }
        .btn { display: block; text-align: center; background: #2563eb; color: #fff; padding: 10px; border-radius: 4px; text-decoration: none; font-weight: bold; transition: background 0.2s; }
        .btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <header>
        <h1>GameCompass</h1>
        <p>Encontre recomendações de jogos baseadas em similaridade de gênero e desenvolvedora.</p>
    </header>
    <div class="container">
        <div class="card" th:each="jogo, stat : ${jogos}">
            <div>
                <h3 th:text="${jogo.nome}">Nome do Jogo</h3>
                <div class="dev" th:text="'Desenvolvedor: ' + ${jogo.desenvolvedor}">Desenvolvedor</div>
                <div class="genres">
                    <span class="badge" th:each="genero : ${jogo.generos}" th:text="${genero}">Gênero</span>
                </div>
                <p class="desc" th:text="${jogo.descricao}">Descrição do jogo...</p>
                <p class="dev" th:if="${jogo.dataLancamento != null}" th:text="'Lançamento: ' + ${#temporals.format(jogo.dataLancamento, 'dd/MM/yyyy')}">Lançamento</p>
            </div>
            <a class="btn" th:href="@{/jogos/{index}/recomendacoes(index=${stat.index})}">Ver Recomendações</a>
        </div>
    </div>
</body>
</html>
